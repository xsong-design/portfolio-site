<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option B: Split Scroll — Homepage Case Studies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #F5F5F5;
      --color-surface: #FFFFFF;
      --color-text: #1A1A1A;
      --color-text-secondary: #555555;
      --color-text-muted: #757575;
      --color-accent: #6B7F6B;
      --color-accent-hover: #4A5D4A;
      --color-border: #E0E0E0;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .option-badge {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
      background: var(--color-text); color: var(--color-bg);
      font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 10px 24px; border-radius: 100px;
    }
    .option-nav {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
      display: flex; gap: 8px;
      background: rgba(26,26,26,0.9); backdrop-filter: blur(12px);
      padding: 8px 16px; border-radius: 100px;
    }
    .option-nav a {
      font-family: var(--font-mono); font-size: 0.625rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(245,245,245,0.5); text-decoration: none;
      padding: 6px 14px; border-radius: 100px; transition: all 0.2s;
    }
    .option-nav a:hover { color: var(--color-bg); }
    .option-nav a.active { background: var(--color-accent); color: #fff; }

    /* Hero */
    .hero-placeholder {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 0 64px 80px;
    }
    .hero-placeholder h1 {
      font-family: var(--font-display); font-size: clamp(4rem,10vw,8rem);
      font-weight: 700; line-height: 0.9; letter-spacing: -0.03em;
    }
    .hero-placeholder p {
      margin-top: 1.5rem; font-size: 1rem; line-height: 1.7;
      color: var(--color-text-secondary); max-width: 400px;
    }
    .hero-placeholder .label {
      font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-text-muted); margin-bottom: 1.5rem;
    }

    .section-header {
      display: flex; align-items: flex-end; gap: 1.5rem;
      padding: 80px 64px 48px;
    }
    .section-index {
      font-family: var(--font-mono); font-size: clamp(3rem,8vw,7rem);
      font-weight: 700; line-height: 1; color: var(--color-accent); opacity: 0.3;
    }
    .section-title {
      font-family: var(--font-display); font-size: clamp(2.5rem,6vw,5rem);
      font-weight: 600; line-height: 0.95; letter-spacing: -0.02em;
    }

    /* SPLIT SCROLL */
    .split-scroll {
      position: relative;
      display: flex;
      padding: 0 64px;
    }

    .split-left {
      position: sticky; top: 0; height: 100vh;
      width: 40%; flex-shrink: 0;
      display: flex; flex-direction: column;
      justify-content: center;
      padding-right: 64px;
    }

    .split-left-content {
      position: relative;
    }

    .split-info {
      position: absolute; top: 0; left: 0; width: 100%;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.4s cubic-bezier(0.16,1,0.3,1),
                  transform 0.4s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
    }
    .split-info.active {
      opacity: 1; transform: translateY(0);
      pointer-events: auto;
      position: relative;
    }

    .split-info-index {
      font-family: var(--font-mono); font-size: 64px; font-weight: 700;
      color: var(--color-accent); opacity: 0.25; line-height: 1;
      margin-bottom: 24px;
    }
    .split-info-title {
      font-family: var(--font-display); font-size: 32px; font-weight: 600;
      letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 16px;
    }
    .split-info-desc {
      font-size: 15px; font-weight: 400; line-height: 1.7;
      color: var(--color-text-secondary); max-width: 320px; margin-bottom: 16px;
    }
    .split-info-tag {
      font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-text-muted); margin-bottom: 24px;
    }
    .split-accent-bar {
      width: 80px; height: 4px; background: var(--color-accent);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .split-right {
      width: 60%;
      display: flex; flex-direction: column;
      gap: 120px;
      padding: 50vh 0;
    }

    .split-image {
      width: 100%; aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
      opacity: 0.4; transform: scale(0.95);
      transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1),
                  transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .split-image.active {
      opacity: 1; transform: scale(1);
    }
    .split-image-gradient {
      position: absolute; inset: 0;
    }
    .split-image-text {
      position: relative; z-index: 1;
      font-family: var(--font-display); font-size: clamp(1.5rem,3vw,2.5rem);
      font-weight: 700; text-align: center; color: rgba(255,255,255,0.08);
      line-height: 1.1;
    }

    .footer-placeholder {
      padding: 80px 64px; border-top: 1px solid var(--color-border);
      text-align: center; color: var(--color-text-muted);
      font-family: var(--font-mono); font-size: 0.75rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .split-scroll { flex-direction: column; padding: 0 24px; }
      .split-left { position: relative; width: 100%; height: auto; padding: 32px 0; }
      .split-right { width: 100%; padding: 0 0 64px; gap: 48px; }
      .split-image { opacity: 1; transform: none; }
      .hero-placeholder { padding: 0 24px 60px; }
      .section-header { padding: 60px 24px 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .split-info { transition: none; }
      .split-image { transition: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="option-badge">Option B — Split Scroll</div>

  <nav class="option-nav">
    <a href="preview-option-a.html">A: Theater</a>
    <a href="preview-option-b.html" class="active">B: Split</a>
    <a href="preview-option-c.html">C: Parallax</a>
  </nav>

  <section class="hero-placeholder">
    <p class="label">product designer</p>
    <h1>xiao<br>song.</h1>
    <p>Designing enterprise messaging experiences at Meta. Crafting complex workflows into clear, usable systems.</p>
  </section>

  <div class="section-header">
    <span class="section-index">01</span>
    <h2 class="section-title">selected<br>work.</h2>
  </div>

  <div class="split-scroll" id="splitScroll">
    <div class="split-left">
      <div class="split-left-content" id="splitLeftContent"></div>
    </div>
    <div class="split-right" id="splitRight"></div>
  </div>

  <footer class="footer-placeholder">
    <p>&copy; 2026 Xiao Song &mdash; Scroll up to replay</p>
  </footer>

  <script>
    const projects = [
      {
        title: 'Marketing Message Liquidity',
        desc: 'Redesigning how businesses manage and optimize message delivery at scale',
        tag: 'Meta · 2024',
        colors: ['#1a1a2e', '#16213e'],
        imageText: 'Marketing\nMessage\nLiquidity'
      },
      {
        title: 'Driver Tipping at Walmart',
        desc: 'Designing a tipping experience that balances customer, driver, and business needs',
        tag: 'Walmart · 2021',
        colors: ['#0f3460', '#162447'],
        imageText: 'Driver\nTipping'
      },
      {
        title: 'Modular Search & Browse',
        desc: 'Building contextual search modules that adapt to how customers shop',
        tag: 'Walmart · 2019',
        colors: ['#1b1a2e', '#2d2b42'],
        imageText: 'Search &\nBrowse'
      },
      {
        title: 'Integrated Campaign Creation',
        desc: 'Unifying ad and messaging workflows within a single campaign experience',
        tag: 'Meta · 2023',
        colors: ['#2d132c', '#1a1a2e'],
        imageText: 'Campaign\nCreation'
      }
    ];

    const leftContent = document.getElementById('splitLeftContent');
    const rightCol = document.getElementById('splitRight');

    projects.forEach((p, i) => {
      const info = document.createElement('div');
      info.className = 'split-info' + (i === 0 ? ' active' : '');
      info.dataset.index = i;
      info.innerHTML = `
        <div class="split-info-index">${String(i + 1).padStart(2, '0')}</div>
        <h3 class="split-info-title">${p.title}</h3>
        <p class="split-info-desc">${p.desc}</p>
        <p class="split-info-tag">${p.tag}</p>
        <div class="split-accent-bar"></div>
      `;
      leftContent.appendChild(info);

      const img = document.createElement('div');
      img.className = 'split-image' + (i === 0 ? ' active' : '');
      img.dataset.index = i;
      img.innerHTML = `
        <div class="split-image-gradient" style="background: linear-gradient(135deg, ${p.colors[0]}, ${p.colors[1]})"></div>
        <span class="split-image-text">${p.imageText.replace(/\n/g, '<br>')}</span>
      `;
      rightCol.appendChild(img);
    });

    const images = document.querySelectorAll('.split-image');
    const infos = document.querySelectorAll('.split-info');
    let currentIdx = 0;

    const imageObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const idx = parseInt(entry.target.dataset.index);
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          if (idx !== currentIdx) {
            currentIdx = idx;
            images.forEach((img, i) => img.classList.toggle('active', i === idx));
            infos.forEach((info, i) => info.classList.toggle('active', i === idx));
          }
        }
      });
    }, { threshold: 0.5, rootMargin: '-25% 0px' });

    images.forEach(img => imageObserver.observe(img));
  </script>
</body>
</html>

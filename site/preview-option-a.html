<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option A: Sticky Theater — Homepage Case Studies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #F5F5F5;
      --color-surface: #FFFFFF;
      --color-text: #1A1A1A;
      --color-text-secondary: #555555;
      --color-text-muted: #757575;
      --color-accent: #6B7F6B;
      --color-accent-hover: #4A5D4A;
      --color-border: #E0E0E0;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .option-badge {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
      background: var(--color-text); color: var(--color-bg);
      font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 10px 24px; border-radius: 100px;
    }
    .option-nav {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
      display: flex; gap: 8px;
      background: rgba(26,26,26,0.9); backdrop-filter: blur(12px);
      padding: 8px 16px; border-radius: 100px;
    }
    .option-nav a {
      font-family: var(--font-mono); font-size: 0.625rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(245,245,245,0.5); text-decoration: none;
      padding: 6px 14px; border-radius: 100px; transition: all 0.2s;
    }
    .option-nav a:hover { color: var(--color-bg); }
    .option-nav a.active { background: var(--color-accent); color: #fff; }

    /* Progress dots */
    .progress-dots {
      position: fixed; right: 32px; top: 50%; transform: translateY(-50%); z-index: 50;
      display: flex; flex-direction: column; gap: 12px;
    }
    .progress-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-border); transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .progress-dot.active {
      background: var(--color-accent);
      transform: scale(1.5);
    }

    /* Hero placeholder */
    .hero-placeholder {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 0 64px 80px;
    }
    .hero-placeholder h1 {
      font-family: var(--font-display); font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 700; line-height: 0.9; letter-spacing: -0.03em;
    }
    .hero-placeholder p {
      margin-top: 1.5rem; font-size: 1rem; line-height: 1.7;
      color: var(--color-text-secondary); max-width: 400px;
    }
    .hero-placeholder .label {
      font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-text-muted); margin-bottom: 1.5rem;
    }

    /* Section header */
    .section-header {
      display: flex; align-items: flex-end; gap: 1.5rem;
      padding: 80px 64px 48px;
    }
    .section-index {
      font-family: var(--font-mono); font-size: clamp(3rem,8vw,7rem);
      font-weight: 700; line-height: 1; color: var(--color-accent); opacity: 0.3;
    }
    .section-title {
      font-family: var(--font-display); font-size: clamp(2.5rem,6vw,5rem);
      font-weight: 600; line-height: 0.95; letter-spacing: -0.02em;
    }

    /* STICKY THEATER */
    .theater {
      position: relative;
    }
    .theater-stage {
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 0 64px; overflow: hidden;
    }
    .theater-project {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 0 64px;
      opacity: 0; transform: scale(1.05);
      transition: opacity 0.6s cubic-bezier(0.16,1,0.3,1),
                  transform 0.8s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
    }
    .theater-project.active {
      opacity: 1; transform: scale(1);
      pointer-events: auto;
    }
    .theater-project.exiting {
      opacity: 0.3; transform: scale(0.92) translateY(-40px);
    }

    .theater-image {
      width: 100%; max-width: 1060px; aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .theater-image-text {
      font-family: var(--font-display); font-size: clamp(2rem,4vw,3.5rem);
      font-weight: 700; text-align: center; color: rgba(255,255,255,0.08);
      line-height: 1.1;
    }
    .theater-image-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--img-color-1, #1a1a1a), var(--img-color-2, #2a2a2a));
    }

    .theater-info {
      display: flex; gap: 32px; align-items: flex-start;
      max-width: 1060px; width: 100%;
      margin-top: 32px;
      opacity: 0; transform: translateY(40px);
      transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1) 0.15s,
                  transform 0.5s cubic-bezier(0.16,1,0.3,1) 0.15s;
    }
    .theater-project.active .theater-info {
      opacity: 1; transform: translateY(0);
    }

    .theater-info-index {
      font-family: var(--font-mono); font-size: 48px; font-weight: 700;
      line-height: 1; color: var(--color-accent); opacity: 0.3;
    }
    .theater-info-content {}
    .theater-info-title {
      font-family: var(--font-display); font-size: 22px; font-weight: 600;
      letter-spacing: -0.01em; line-height: 1.2;
    }
    .theater-info-desc {
      margin-top: 8px; font-size: 15px; line-height: 1.6;
      color: var(--color-text-secondary); max-width: 480px;
    }
    .theater-info-tag {
      margin-top: 12px; font-family: var(--font-mono);
      font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* Footer placeholder */
    .footer-placeholder {
      padding: 80px 64px; border-top: 1px solid var(--color-border);
      text-align: center; color: var(--color-text-muted);
      font-family: var(--font-mono); font-size: 0.75rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .theater-project { transition: none; }
      .theater-info { transition: none; }
    }
    @media (max-width: 768px) {
      .hero-placeholder { padding: 0 24px 60px; }
      .section-header { padding: 60px 24px 32px; }
      .theater-stage { padding: 0 24px; }
      .theater-project { padding: 0 24px; }
      .theater-image { aspect-ratio: 3 / 2; }
      .progress-dots { right: 16px; }
      .option-badge { font-size: 0.5625rem; padding: 8px 16px; }
    }
  </style>
</head>
<body>

  <div class="option-badge">Option A — Sticky Theater</div>

  <nav class="option-nav">
    <a href="preview-option-a.html" class="active">A: Theater</a>
    <a href="preview-option-b.html">B: Split</a>
    <a href="preview-option-c.html">C: Parallax</a>
  </nav>

  <div class="progress-dots" id="progressDots"></div>

  <!-- Hero -->
  <section class="hero-placeholder">
    <p class="label">product designer</p>
    <h1>xiao<br>song.</h1>
    <p>Designing enterprise messaging experiences at Meta. Crafting complex workflows into clear, usable systems.</p>
  </section>

  <!-- Section Header -->
  <div class="section-header">
    <span class="section-index">01</span>
    <h2 class="section-title">selected<br>work.</h2>
  </div>

  <!-- Sticky Theater -->
  <div class="theater" id="theater">
    <div class="theater-stage" id="theaterStage">
      <!-- Projects rendered by JS -->
    </div>
  </div>

  <footer class="footer-placeholder">
    <p>&copy; 2026 Xiao Song &mdash; Scroll up to replay</p>
  </footer>

  <script>
    const projects = [
      {
        title: 'Marketing Message Liquidity',
        desc: 'Redesigning how businesses manage and optimize message delivery at scale',
        tag: 'Meta · 2024',
        colors: ['#1a1a2e', '#16213e'],
        imageText: 'Marketing\nMessage\nLiquidity'
      },
      {
        title: 'Driver Tipping at Walmart',
        desc: 'Designing a tipping experience that balances customer, driver, and business needs',
        tag: 'Walmart · 2021',
        colors: ['#0f3460', '#162447'],
        imageText: 'Driver\nTipping'
      },
      {
        title: 'Modular Search & Browse',
        desc: 'Building contextual search modules that adapt to how customers shop',
        tag: 'Walmart · 2019',
        colors: ['#1b1a2e', '#2d2b42'],
        imageText: 'Search &\nBrowse'
      },
      {
        title: 'Integrated Campaign Creation',
        desc: 'Unifying ad and messaging workflows within a single campaign experience',
        tag: 'Meta · 2023',
        colors: ['#2d132c', '#1a1a2e'],
        imageText: 'Campaign\nCreation'
      }
    ];

    const stage = document.getElementById('theaterStage');
    const theater = document.getElementById('theater');
    const dotsContainer = document.getElementById('progressDots');

    theater.style.height = (projects.length * 100 + 100) + 'vh';

    projects.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'theater-project';
      el.dataset.index = i;
      el.innerHTML = `
        <div class="theater-image">
          <div class="theater-image-gradient" style="background: linear-gradient(135deg, ${p.colors[0]}, ${p.colors[1]})"></div>
          <span class="theater-image-text">${p.imageText.replace(/\n/g, '<br>')}</span>
        </div>
        <div class="theater-info">
          <span class="theater-info-index">${String(i + 1).padStart(2, '0')}</span>
          <div class="theater-info-content">
            <h3 class="theater-info-title">${p.title}</h3>
            <p class="theater-info-desc">${p.desc}</p>
            <p class="theater-info-tag">${p.tag}</p>
          </div>
        </div>
      `;
      stage.appendChild(el);

      const dot = document.createElement('div');
      dot.className = 'progress-dot';
      dotsContainer.appendChild(dot);
    });

    const projectEls = document.querySelectorAll('.theater-project');
    const dots = document.querySelectorAll('.progress-dot');
    let currentIndex = -1;

    function updateTheater() {
      const theaterRect = theater.getBoundingClientRect();
      const theaterHeight = theater.offsetHeight;
      const scrollIntoTheater = -theaterRect.top;
      const segmentHeight = theaterHeight / (projects.length + 1);

      let activeIdx = Math.floor(scrollIntoTheater / segmentHeight);
      activeIdx = Math.max(0, Math.min(projects.length - 1, activeIdx));

      if (theaterRect.top > window.innerHeight || theaterRect.bottom < 0) {
        activeIdx = -1;
      }

      if (activeIdx !== currentIndex) {
        currentIndex = activeIdx;
        projectEls.forEach((el, i) => {
          el.classList.remove('active', 'exiting');
          if (i === activeIdx) el.classList.add('active');
          else if (i === activeIdx - 1) el.classList.add('exiting');
        });
        dots.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
      }
    }

    window.addEventListener('scroll', () => requestAnimationFrame(updateTheater), { passive: true });
    updateTheater();
  </script>
</body>
</html>
